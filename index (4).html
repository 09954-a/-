<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมตอบคำถาม Quiz Game</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:600px;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#0077ff;
}

#question{
    font-size:22px;
    margin:20px 0;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#0077ff;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#005fd1;
}

.correct{
    background:green !important;
}

.wrong{
    background:red !important;
}

#nextBtn{
    display:none;
}

#score{
    text-align:center;
    font-size:22px;
}
</style>

</head>
<body>

<div class="container">

<h1>🎮 เกมตอบคำถาม</h1>

<div id="question"></div>

<div id="answer-buttons"></div>

<button id="nextBtn" class="btn">ข้อถัดไป</button>

<div id="score"></div>

</div>

<script>

const questions = [

{
question:"ประเทศไทยมีกี่จังหวัด?",
answers:[
{text:"75",correct:false},
{text:"76",correct:false},
{text:"77",correct:true},
{text:"78",correct:false}
]
},

{
question:"2 + 5 = ?",
answers:[
{text:"6",correct:false},
{text:"7",correct:true},
{text:"8",correct:false},
{text:"9",correct:false}
]
},

{
question:"ดาวเคราะห์ที่เราอาศัยอยู่คือ?",
answers:[
{text:"ดาวอังคาร",correct:false},
{text:"ดาวศุกร์",correct:false},
{text:"โลก",correct:true},
{text:"ดาวพุธ",correct:false}
]
},

{
question:"HTML ย่อมาจากอะไร?",
answers:[
{text:"Hyper Text Markup Language",correct:true},
{text:"Home Tool Markup Language",correct:false},
{text:"Hyper Transfer Machine Language",correct:false},
{text:"Hyper Type Language",correct:false}
]
},

{
question:"สีที่เกิดจากการผสมแดงกับเหลืองคือ?",
answers:[
{text:"ม่วง",correct:false},
{text:"เขียว",correct:false},
{text:"ส้ม",correct:true},
{text:"น้ำเงิน",correct:false}
]
}

];

const questionElement=document.getElementById("question");
const answerButtons=document.getElementById("answer-buttons");
const nextButton=document.getElementById("nextBtn");
const scoreElement=document.getElementById("score");

let currentQuestionIndex=0;
let score=0;

function startGame(){
currentQuestionIndex=0;
score=0;
nextButton.innerHTML="ข้อถัดไป";
showQuestion();
}

function showQuestion(){

resetState();

let currentQuestion=questions[currentQuestionIndex];

questionElement.innerHTML=(currentQuestionIndex+1)+". "+currentQuestion.question;

currentQuestion.answers.forEach(answer=>{

const button=document.createElement("button");

button.innerHTML=answer.text;

button.classList.add("btn");

if(answer.correct){
button.dataset.correct=answer.correct;
}

button.addEventListener("click",selectAnswer);

answerButtons.appendChild(button);

});

}

function resetState(){

nextButton.style.display="none";

while(answerButtons.firstChild){

answerButtons.removeChild(answerButtons.firstChild);

}

}

function selectAnswer(e){

const selectedBtn=e.target;

const correct=selectedBtn.dataset.correct==="true";

if(correct){

selectedBtn.classList.add("correct");

score++;

}else{

selectedBtn.classList.add("wrong");

}

Array.from(answerButtons.children).forEach(button=>{

if(button.dataset.correct==="true"){

button.classList.add("correct");

}

button.disabled=true;

});

nextButton.style.display="block";

}

function showScore(){

resetState();

questionElement.innerHTML="🎉 จบเกม";

scoreElement.innerHTML="คุณได้ "+score+" / "+questions.length+" คะแนน";

nextButton.innerHTML="เล่นอีกครั้ง";

nextButton.style.display="block";

}

function handleNextButton(){

currentQuestionIndex++;

if(currentQuestionIndex<questions.length){

showQuestion();

}else{

showScore();

}

}

nextButton.addEventListener("click",()=>{

if(currentQuestionIndex<questions.length){

handleNextButton();

}else{

scoreElement.innerHTML="";

startGame();

}

});

startGame();

</script>

</body>
</html>
